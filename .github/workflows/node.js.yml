name: Node.js CI/CD with PM2

on:
  push:
    branches:
      - qa  # Deploy on pushes to the qa branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Optional: install dependencies on runner (for build/test if needed)
      - name: Install dependencies (runner)
        working-directory: server
        run: npm ci

      # 4️⃣ Deploy to server via SSH
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            #!/bin/bash

            # ----------------------------
            # Configuration
            # ----------------------------
            DEPLOY_DIR="/home/ubuntu/lrs_backend"
            REPO_SSH="git@github.com:AIQUANT-Tech/CardanoRewards.git"
            BRANCH="qa"
            APP_NAME="lrs_backend"

            # ----------------------------
            # Prepare deployment folder
            # ----------------------------
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            # ----------------------------
            # Clone repo if empty or .git missing
            # ----------------------------
            if [ ! -d ".git" ]; then
                echo "Cloning repository via SSH..."
                export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_lrs"
                git clone -b $BRANCH $REPO_SSH .
            else
                echo "Git repo exists. Switching remote to SSH..."
                export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_lrs"
                git remote set-url origin $REPO_SSH

                echo "Fetching latest code and cleaning working tree..."
                git fetch --all
                git reset --hard origin/$BRANCH
                git clean -fd
            fi

            # ----------------------------
            # Navigate to server folder
            # ----------------------------
            SERVER_DIR="$DEPLOY_DIR/server"
            if [ ! -d "$SERVER_DIR" ]; then
                echo "Error: server folder not found!"
                exit 1
            fi
            cd $SERVER_DIR

            # ----------------------------
            # Install dependencies
            # ----------------------------
            echo "Installing dependencies with npm ci..."
            npm ci

            # ----------------------------
            # Start / Restart with PM2
            # ----------------------------
            echo "Starting/restarting app with PM2..."
            pm2 describe $APP_NAME > /dev/null 2>&1 || pm2 start npm --name "$APP_NAME" -- start
            pm2 save
            pm2 restart $APP_NAME

            echo "✅ Deployment complete!"

